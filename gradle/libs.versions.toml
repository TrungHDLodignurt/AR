[versions]
# This catalog carries only what :app and :AR_feature actually resolve. A host integrating the
# module has its own, far larger catalog — merge into that one (see the trung-apply-ar-measure
# skill), and do not copy a host's catalog back here: that happened once, in 79ea131, and buried
# the pins below under ~40 unused host aliases.
agp = "9.2.1"
kotlin = "2.3.10"
# 2026.08.00 pulls compose-runtime 1.12.x, which demands compileSdk 37. Pinned to the last BOM
# that compiles against 36.
composeBom = "2026.05.00"
coreKtx = "1.17.0"
activityCompose = "1.12.4"
# One key for every lifecycle artifact on purpose — runtime-ktx, runtime-compose,
# viewmodel-compose and viewmodel-savedstate are released together and must not drift apart.
lifecycle = "2.10.0"
junit = "4.13.2"

# ===== AR_feature module (:AR_feature) =====
# SceneView/Filament wrapper around ARCore — the AR camera, plane detection and 3D overlay.
arsceneview = "4.31.0"
# testImplementation only: android.jar's stub org.json throws "not mocked" in unit tests, so
# AR_feature's ReferenceObjectJsonTest needs the real JVM implementation instead of Robolectric.
json = "20240303"
# Test-only: Dispatchers.setMain, so AR_feature's MviViewModelTest can run off-device.
coroutinesTest = "1.7.3"
# Picture Measure's primary auto-fit detector. Unbundled — the model arrives through Play
# Services, so no APK weight — but absent on a non-GMS device, where AR_feature falls back to
# its own Canny+Hough detector. Beta upstream; do not "fix" the -beta1 suffix, no stable exists.
mlkitSubjectSegmentation = "16.0.0-beta1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

# Compose + lifecycle, under the literal dotted alias names AR_feature/build.gradle.kts asks for
# (libs.androidx.ui, libs.androidx.material3, ...). A host usually already ships these artifacts
# under different alias names (androidx-compose-ui, androidx-compose-material3, ...); the merge
# step adds these names alongside, deliberate duplicates-by-name and not by artifact, so the
# module's own checked-in build script never needs a per-host edit.
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
# debugImplementation only — the release build must not ship the tooling inspector.
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-savedstate = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }

sceneview-ar = { group = "io.github.sceneview", name = "arsceneview", version.ref = "arsceneview" }
json = { group = "org.json", name = "json", version.ref = "json" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
mlkit-subject-segmentation = { group = "com.google.android.gms", name = "play-services-mlkit-subject-segmentation", version.ref = "mlkitSubjectSegmentation" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# No kotlin-android alias: AGP 9 ships built-in Kotlin support and both modules rely on it.
# A host still on AGP 8.x cannot build :AR_feature at all — that is a hard gate, not a merge item.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
