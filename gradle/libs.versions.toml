[versions]
# Pinned to 9.2.1 to match VslWidgetSDK's submodule build — AGP enforces a single
# version across composite builds.
agp = "9.2.1"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.12.4"
appcompat = "1.7.1"
kotlin = "2.3.10"
composeBom = "2026.05.00"
koin = "4.0.4"
coil = "3.1.0"
lifecycleCompose = "2.10.0"
gson = "2.13.2"
retrofit = "3.0.0"
okhttp = "5.3.2"
apiSignature = "2.1.0-alpha04"
aperoServices = "1.0.7"
firebaseBom = "33.7.0"
googleServices = "4.4.2"
firebaseCrashlyticsGradlePlugin = "3.0.6"
firebaseAppDistributionPlugin = "5.2.0"
room = "2.8.4"
workManager = "2.10.1"
lifecycleProcess = "2.10.0"
ksp = "2.3.5"
glideCompose = "1.0.0-beta08"
glide = "5.0.5"
media3 = "1.9.2"
lottie = "6.6.2"

# Apero/VisionLab
tutorialSdkVersion = "3.5.3"
visionlabAdsCore = "1.2.8-alpha03"
visionlabBilling = "1.0.0-alpha03"
adsCoreCompose = "1.0.0-alpha01"
vslRatingSdk = "1.0.1"
vslWidgetSdk = "1.0.1"
vslCheckinSdk = "1.0.0"
# AdMob AppLovin mediation adapter. Pinned to align with the AppLovin SDK (13.6.0) pulled in
# transitively by widget-sdk → monetize:ads-sdk; the adapter version's first 3 parts must match
# the SDK, else AppLovin throws "Mismatched AdMob adapter / AppLovin SDK versions" at init.
applovinMediation = "13.6.0.0"

# ===== AR_feature module (:AR_feature) =====
# SceneView/Filament wrapper around ARCore — the AR camera, plane detection and 3D overlay.
arsceneview = "4.31.0"
# testImplementation only: android.jar's stub org.json throws "not mocked" in unit tests, so
# AR_feature's ReferenceObjectJsonTest needs the real JVM implementation instead of Robolectric.
json = "20240303"
# Test-only: Dispatchers.setMain, so AR_feature's MviViewModelTest can run off-device.
coroutinesTest = "1.7.3"
# Picture Measure's primary auto-fit detector. Unbundled — the model arrives through Play
# Services, so no APK weight — but absent on a non-GMS device, where AR_feature falls back to
# its own Canny+Hough detector. Beta upstream; do not "fix" the -beta1 suffix, no stable exists.
mlkitSubjectSegmentation = "16.0.0-beta1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-text-google-fonts = { group = "androidx.compose.ui", name = "ui-text-google-fonts" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Glide
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
glide-compose = { module = "com.github.bumptech.glide:compose", version.ref = "glideCompose" }

# Media3 (ExoPlayer)
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
media3-transformer = { module = "androidx.media3:media3-transformer", version.ref = "media3" }
media3-effect = { module = "androidx.media3:media3-effect", version.ref = "media3" }

# Coil
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# Lottie
lottie-compose = { group = "com.airbnb.android", name = "lottie-compose", version.ref = "lottie" }

# Lifecycle
androidx-lifecycle-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleCompose" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleRuntimeKtx" }

# Koin
koin-bom = { group = "io.insert-koin", name = "koin-bom", version.ref = "koin" }
koin-core = { group = "io.insert-koin", name = "koin-core" }
koin-android = { group = "io.insert-koin", name = "koin-android" }
koin-compose = { group = "io.insert-koin", name = "koin-compose" }
koin-compose-viewmodel = { group = "io.insert-koin", name = "koin-compose-viewmodel" }
koin-workmanager = { group = "io.insert-koin", name = "koin-androidx-workmanager" }

# Gson
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# Retrofit
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }

# OkHttp
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# Apero Signature
api-signature = { module = "apero:api-signature", version.ref = "apiSignature" }
apero-identify-service = { module = "apero-inhouse:apero-identify-service", version.ref = "aperoServices" }

# Firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-config = { group = "com.google.firebase", name = "firebase-config" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics-ktx = { group = "com.google.firebase", name = "firebase-crashlytics" }

# Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# WorkManager
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }

# Lifecycle Process
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycleProcess" }

# VisionLab
visionlab-tutorial = { module = "visionlab:tutorial", version.ref = "tutorialSdkVersion" }
visionlab-ads = { module = "visionlab:ads-core", version.ref = "visionlabAdsCore" }
billing-sdk = { module = "visionlab:billing", version.ref = "visionlabBilling" }
ads-core-compose = { module = "visionlab:ads-core-compose", version.ref = "adsCoreCompose" }
vsl-rating-sdk = { module = "visionlab:rating-sdk", version.ref = "vslRatingSdk" }
vsl-widget-sdk = { module = "visionlab:widget-sdk", version.ref = "vslWidgetSdk" }
vsl-checkin-sdk = { module = "visionlab:checkin-sdk", version.ref = "vslCheckinSdk" }
applovin-mediation = { module = "com.google.ads.mediation:applovin", version.ref = "applovinMediation" }

# ===== AR_feature module (:AR_feature) =====
# AR_feature/build.gradle.kts references catalog aliases by their literal dotted names
# (libs.androidx.ui, libs.androidx.material3, ...). The aliases below point at artifacts this
# host already ships under different names (androidx-compose-ui, androidx-compose-material3,
# androidx-lifecycle-compose); they are deliberate duplicates-by-name, not by artifact, so the
# module's own checked-in build script needs no per-host edits. Do not dedupe them away.
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleCompose" }
androidx-lifecycle-viewmodel-savedstate = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-savedstate", version.ref = "lifecycleCompose" }
sceneview-ar = { group = "io.github.sceneview", name = "arsceneview", version.ref = "arsceneview" }
json = { group = "org.json", name = "json", version.ref = "json" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
mlkit-subject-segmentation = { group = "com.google.android.gms", name = "play-services-mlkit-subject-segmentation", version.ref = "mlkitSubjectSegmentation" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsGradlePlugin" }
firebase-app-distribution = { id = "com.google.firebase.appdistribution", version.ref = "firebaseAppDistributionPlugin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

